<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chapter-bar.js — auto demo</title>
<style>
  body{margin:0;background:#f4f5f7;color:#1a1d23;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;}
  h1{font-size:18px;margin:0;}
  p{font-size:13px;color:#6b7280;max-width:640px;text-align:center;margin:0 0 16px;}
  .demo{width:100%;max-width:720px;}
  video{display:block;width:100%;border-radius:12px;background:#000;}
  code{background:#e9ebef;padding:2px 6px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
  <h1>Drop-in demo</h1>
  <p>The only integration is the one <code>&lt;script&gt;</code> at the bottom of this page.
     Every <code>&lt;video&gt;</code> below got a chapter bar with zero per-element wiring.</p>

  <!-- Real named chapters via a chapters track (the script reads this) -->
  <div class="demo">
    <video src="keynote.mov" controls playsinline preload="metadata" crossorigin="anonymous">
      <track kind="chapters" src="chapters.vtt" default>
    </video>
  </div>

  <!-- Same script, per-video overrides via data-attributes -->
  <div class="demo">
    <video src="keynote.mov" controls playsinline preload="metadata"
           data-cb-interval="5" data-cb-label-position="bottom"></video>
  </div>

  <!-- The entire integration: one tag. Page-wide defaults set here. -->
  <script src="chapter-bar.js" data-interval="8" data-label-position="top"></script>
</body>
</html>
